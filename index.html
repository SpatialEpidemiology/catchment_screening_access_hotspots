<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Census Tracts Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
body { margin:0; padding:0; font-family: Arial, sans-serif; }
#map { width:100%; height:100vh; }
#status { position:absolute; top:10px; left:10px; z-index:1000; background:#fff; padding:5px 10px; border-radius:4px; box-shadow:0 0 6px rgba(0,0,0,0.3); }
#loadingIndicator { position:absolute; top:50px; left:10px; z-index:1000; display:none; background:#fff; padding:5px 10px; border-radius:4px; box-shadow:0 0 6px rgba(0,0,0,0.3); }
.combined-popup { font-size:14px; line-height:1.4; max-width:300px; }
.combined-popup .section { margin-bottom:10px; padding-bottom:5px; border-bottom:1px solid #ccc; }
.combined-popup .section-title { font-weight:bold; margin-bottom:5px; }
.combined-popup .data-row { margin-bottom:2px; }
.combined-popup .data-label { font-weight:bold; }
.combined-popup .catchment-list { margin-top:5px; padding-left:10px; }
.combined-popup .catchment-list-item { margin-bottom:2px; }
</style>
</head>
<body>
<div id="status">Loading map...</div>
<div id="loadingIndicator">Loading data...</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  const statusEl = document.getElementById('status');
  const loadingIndicator = document.getElementById('loadingIndicator');
  const map = L.map('map', { zoomControl:true }).setView([33.5186,-86.8104], 7);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.carto.com/">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);
  let tractsLayer = null;
  let catchmentsLayer = null;
  let currentField = 'overlap_type';
  let currentProvider = 'pcp';
  function showLoading(show){ loadingIndicator.style.display = show ? 'block':'none'; }
  function loadCatchments(){
    statusEl.textContent = 'Loading catchments...';
    return fetch('https://raw.githubusercontent.com/SpatialEpidemiology/catchment_screening_access_hotspots/main/assets/catchments.json')
      .then(r=>r.json())
      .then(g=>{
        catchmentsLayer = L.geoJSON(g,{style:{ color:'#000', weight:4.5, fillOpacity:0, dashArray:'5,8', opacity:0.9 }}).addTo(map);
        catchmentsLayer.bringToFront();
        statusEl.textContent = 'Catchments loaded';
      });
  }
  function loadTracts(){
    showLoading(true);
    statusEl.textContent = 'Loading census tracts...';
    const ci = currentField.includes('_99') ? '99':'95';
    const file = currentProvider==='pcp'
      ? `https://raw.githubusercontent.com/SpatialEpidemiology/catchment_screening_access_hotspots/main/assets/sc_acc_hot_spots_overlap_${ci}_simpl_topo.json`
      : `https://raw.githubusercontent.com/SpatialEpidemiology/catchment_screening_access_hotspots/main/assets/sc_acc_gi_hot_spots_overlap_${ci}_topo_simpl.json`;
    return fetch(file)
      .then(r=>r.json())
      .then(t=>{
        if(tractsLayer) map.removeLayer(tractsLayer);
        const geojson = topojson.feature(t, t.objects[Object.keys(t.objects)[0]]);
        tractsLayer = L.geoJSON(geojson, { style: styleTract }).addTo(map);
        catchmentsLayer && catchmentsLayer.bringToFront();
        statusEl.textContent = 'Census tracts loaded';
        showLoading(false);
      });
  }
  function styleTract(feature){
    const v = feature.properties[currentField];
    if(v==='Low Screening-Low Access Cluster') return { fillColor:'#d73027', fillOpacity:0.8, color:'#444', weight:0.3 };
    if(v==='High Screening-High Access Cluster') return { fillColor:'#4575b4', fillOpacity:0.8, color:'#444', weight:0.3 };
    return { fillColor:'#bebebe', fillOpacity:0.8, color:'#444', weight:0.3 };
  }
  function findFeaturesAtPoint(latlng){
    const point = turf.point([latlng.lng, latlng.lat]);
    const features = [];
    if(tractsLayer){
      tractsLayer.eachLayer(layer=>{
        try { if(turf.booleanPointInPolygon(point, layer.feature)) features.push({ type:'tract', properties: layer.feature.properties }); }
        catch(e){console.error('Tract check error', e);}
      });
    }
    if(catchmentsLayer){
      catchmentsLayer.eachLayer(layer=>{
        try { if(turf.booleanPointInPolygon(point, layer.feature)) features.push({ type:'catchment', properties: layer.feature.properties }); }
        catch(e){console.error('Catchment check error', e);}
      });
    }
    return features;
  }
  function showCombinedPopup(latlng, features){
    let content = `<div class="combined-popup">`;
    const tracts = features.filter(f=>f.type==='tract');
    const catchments = features.filter(f=>f.type==='catchment');
    if(tracts.length>0){
      content += `<h4>Tract Information</h4>`;
      tracts.forEach((tract,index)=>{
        const props = tract.properties;
        content += `<div class="section">`;
        content += `<div class="section-title">${props.name || 'Tract ' + (index+1)}</div>`;
        for(const key in props){
          if(key!==currentField) content += `<div class="data-row"><span class="data-label">${key}:</span> <span class="data-value">${props[key]}</span></div>`;
        }
        content += `<div class="data-row"><span class="data-label">Cluster Type:</span> <span class="data-value">${props[currentField]}</span></div>`;
        content += `</div>`;
      });
    }
    if(catchments.length>0){
      content += `<div class="section"><div class="section-title">Catchment Areas (${catchments.length})</div>`;
      content += `<div class="catchment-list">`;
      catchments.forEach((c,index)=>{ content += `<div class="catchment-list-item">${c.properties.name || 'Catchment '+(index+1)}</div>`; });
      content += `</div></div>`;
    }
    content += `</div>`;
    L.popup().setLatLng(latlng).setContent(content).openOn(map);
  }
  map.on('click', function(e){
    const features = findFeaturesAtPoint(e.latlng);
    if(features.length>0) showCombinedPopup(e.latlng, features);
  });
  loadCatchments().then(loadTracts);
});
</script>
</body>
</html>
