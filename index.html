<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlapping Clusters of Access to Care & CRC Screening</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #map { background: #f0f5f9; }

    .control-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.95);
      padding: 12px;
      border-radius: 8px;
      z-index: 1000;
      max-width: 240px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .provider-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.95);
      padding: 12px;
      border-radius: 8px;
      z-index: 1000;
      max-width: 220px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      color: #2c3e50;
      border-bottom: 1px solid #eee;
      padding-bottom: 5px;
    }

    label {
      display: block;
      margin: 6px 0;
      cursor: pointer;
    }

    .legend {
      position: absolute;
      bottom: 70px;
      right: 20px;
      background: rgba(255,255,255,0.95);
      padding: 12px;
      border-radius: 8px;
      z-index: 1000;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
    }

    .color-box {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      border: 1px solid #999;
    }

    .line-box {
      width: 18px;
      height: 6px;
      margin-right: 8px;
      background: #000;
    }

    .status-bar {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(255,255,255,0.9);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- LEFT PANEL: CI TOGGLE -->
<div class="control-panel">
  <h3>Credible Interval</h3>
  <label>
    <input type="radio" name="tractField" value="overlap_type" checked>
    95% Credible Interval
  </label>
  <label>
    <input type="radio" name="tractField" value="overlap_type_99">
    99% Credible Interval
  </label>
</div>

<!-- RIGHT PANEL: PROVIDER TOGGLE -->
<div class="provider-panel">
  <h3>Provider Type</h3>
  <label>
    <input type="radio" name="providerType" value="pcp" checked>
    Primary Care Providers
  </label>
  <label>
    <input type="radio" name="providerType" value="gi">
    GI Providers
  </label>
</div>

<!-- LEGEND -->
<div class="legend">
  <h3>Legend</h3>
  <div class="legend-item">
    <span class="color-box" style="background:#d73027"></span>
    Low Screening – Low Access
  </div>
  <div class="legend-item">
    <span class="color-box" style="background:#4575b4"></span>
    High Screening – High Access
  </div>
  <div class="legend-item">
    <span class="color-box" style="background:#bebebe"></span>
    Non-significant
  </div>
  <div class="legend-item">
    <span class="line-box"></span>
    Catchment Areas
  </div>
</div>

<div class="status-bar" id="status">Initializing map…</div>

<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

  const statusEl = document.getElementById('status');

  let currentField = 'overlap_type';
  let currentProvider = 'pcp';

  const map = L.map('map', { zoomControl: false })
    .setView([33.5, -86.8], 7);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png')
    .addTo(map);

  L.control.zoom({ position: 'topright' }).addTo(map);

  let tractsLayer, catchmentsLayer;

  /* ---------- LOAD CATCHMENTS ---------- */
  fetch('https://raw.githubusercontent.com/SpatialEpidemiology/catchment_screening_access_hotspots/main/assets/catchments.json')
    .then(r => r.json())
    .then(data => {
      catchmentsLayer = L.geoJSON(data, {
        style: {
          color: '#000',
          weight: 4,
          dashArray: '5,8',
          fillOpacity: 0
        }
      }).addTo(map);
    });

  /* ---------- LOAD TRACTS ---------- */
  function loadTracts() {
    const ci = currentField.includes('_99') ? '99' : '95';

    let file;
    if (currentProvider === 'pcp') {
      file = `https://raw.githubusercontent.com/SpatialEpidemiology/catchment_screening_access_hotspots/main/assets/sc_acc_hot_spots_overlap_${ci}_simpl_topo.json`;
    } else {
      file = `https://raw.githubusercontent.com/SpatialEpidemiology/catchment_screening_access_hotspots/main/assets/sc_acc_gi_hot_spots_overlap_${ci}_topo_simpl.json`;
    }

    statusEl.textContent = `Loading ${currentProvider.toUpperCase()} (${ci}%)…`;

    fetch(file)
      .then(r => r.json())
      .then(topo => {
        if (tractsLayer) map.removeLayer(tractsLayer);

        const obj = topo.objects[Object.keys(topo.objects)[0]];
        const geo = topojson.feature(topo, obj);

        tractsLayer = L.geoJSON(geo, {
          style: feature => {
            const field = currentProvider === 'gi'
              ? 'overlap_type'
              : currentField;

            const v = feature.properties[field];

            if (v === 'Low Screening-Low Access Cluster')
              return { fillColor:'#d73027', fillOpacity:0.8, weight:0.3 };
            if (v === 'High Screening-High Access Cluster')
              return { fillColor:'#4575b4', fillOpacity:0.8, weight:0.3 };
            return { fillColor:'#bebebe', fillOpacity:0.8, weight:0.3 };
          }
        }).addTo(map);

        catchmentsLayer?.bringToFront();
        statusEl.textContent = 'Map ready';
      });
  }

  /* ---------- EVENT LISTENERS ---------- */
  document.querySelectorAll('input[name="tractField"]').forEach(r =>
    r.addEventListener('change', e => {
      currentField = e.target.value;
      loadTracts();
    })
  );

  document.querySelectorAll('input[name="providerType"]').forEach(r =>
    r.addEventListener('change', e => {
      currentProvider = e.target.value;
      loadTracts();
    })
  );

  loadTracts();
});
</script>

</body>
</html>
